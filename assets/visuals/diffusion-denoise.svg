<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diffusion denoising: a noisy grid progressively settles into a clean structured pattern, looping from t=T to t=0">
  <style>
    .card{ fill:#F8FAFC; stroke:#E2E8F0; }
    .title{ fill:#1E3A8A; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-weight:600; }
    .lbl{ fill:#475569; font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .arrow{ stroke:#94A3B8; stroke-width:1.5; }
    @media (prefers-color-scheme: dark){
      .card{ fill:#0D1117; stroke:#30363D; }
      .title{ fill:#60A5FA; }
      .lbl{ fill:#8B949E; }
      .arrow{ stroke:#484F58; }
    }
  </style>

  <rect class="card" x="1" y="1" width="418" height="198" rx="12"/>
  <text class="title" x="20" y="26" font-size="13">Diffusion Denoising — Structured Generative Modeling</text>

  <text class="lbl" x="150" y="52" font-size="10">t = T (noise)</text>
  <text class="lbl" x="310" y="52" font-size="10">t = 0 (signal)</text>
  <path class="arrow" d="M175,90 L305,90" marker-end="url(#ah)"/>
