    <rect x="22" y="66" width="22" height="22" fill="#F87171"><animate attributeName="fill" values="#F87171;#F87171;#60A5FA;#60A5FA;#F87171" keyTimes="0;0.35;0.55;0.85;1" dur="6s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="44" y="66" width="22" height="22" fill="#FBBF24"><animate attributeName="fill" values="#FBBF24;#FBBF24;#60A5FA;#60A5FA;#FBBF24" keyTimes="0;0.35;0.55;0.85;1" dur="6s" begin="0.75s" repeatCount="indefinite"/></rect>
